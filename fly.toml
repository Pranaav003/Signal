app = "signal-backend"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[env]
  NODE_ENV = "production"
  TRUST_PROXY = "true"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
