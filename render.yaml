# Render Blueprint — Option A: free web services + Neon Postgres + Upstash Redis
# https://render.com/docs/blueprint-spec
#
# Bull/Redis/worker architecture preserved. Worker runs as signal-worker-web (type: web).
# Neon/Upstash values below are rotated placeholder credentials showing exact format.
# Replace with fresh Neon/Upstash values before a real deployment.
# OPENAI_API_KEY remains sync:false — set in Render dashboard.
# Ping backend /health and worker-web /health with UptimeRobot (free tier sleeps when idle).

services:
  - type: web
    name: signal-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_EMBEDDED_WORKERS
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: FRONTEND_URL
        value: https://signal-frontend-e4oa.onrender.com
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_uZUv5znhX3yp@ep-winter-night-apz1odea-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require
