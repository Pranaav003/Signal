# Render Blueprint — Option A: free web services + Neon Postgres + Upstash Redis
# https://render.com/docs/blueprint-spec
#
# NEVER commit real DATABASE_URL, REDIS_URL, PROXY_PASSWORD, or API keys here.
# Set secrets in the Render dashboard (Environment) or use sync: false below.
# Ping backend /health and worker-web /health with UptimeRobot (free tier sleeps when idle).

services:
  - type: web
    name: signal-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_EMBEDDED_WORKERS
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: FRONTEND_URL
        value: https://signal.pranaaviyer.com
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: REDDIT_USER_AGENT
        value: Signal/1.0 (by /u/Pranaav003)
      - key: REDDIT_REQUEST_DELAY_MS
        value: "3000"
      - key: PROXY_LIST
        value: p.webshare.io:80
      - key: PROXY_USERNAMES
        sync: false
      - key: PROXY_PASSWORD
        sync: false
      - key: USE_MOCK_REDDIT
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_CLASSIFIER_MODEL
        value: gpt-4o-mini
      - key: REQUIRE_AI_CLASSIFIER
        value: "true"
      - key: SCAN_INCREMENTAL_PERSIST
        value: "false"
      - key: SCAN_MAX_LEADS_PER_RUN
        value: "40"
      - key: SCAN_MAX_RAW_TOTAL
        value: "500"
      - key: SCAN_MAX_RAW_PER_PAIR
        value: "50"
      - key: SCAN_MAX_PAIRS
        value: "30"
      - key: MAX_QUALIFICATION_CANDIDATES
        value: "80"
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: signal-worker-web
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:worker-web
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: REDDIT_USER_AGENT
        value: Signal/1.0 (by /u/Pranaav003)
      - key: REDDIT_REQUEST_DELAY_MS
        value: "3000"
      - key: PROXY_LIST
        value: p.webshare.io:80
      - key: PROXY_USERNAMES
        sync: false
      - key: PROXY_PASSWORD
        sync: false
      - key: USE_MOCK_REDDIT
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_CLASSIFIER_MODEL
        value: gpt-4o-mini
      - key: REQUIRE_AI_CLASSIFIER
        value: "true"
      - key: REDDIT_STARTUP_PROBE_MS
        value: "45000"
      - key: SCAN_INCREMENTAL_PERSIST
        value: "false"
      - key: SCAN_MAX_LEADS_PER_RUN
        value: "40"
      - key: SCAN_MAX_RAW_TOTAL
        value: "500"
      - key: SCAN_MAX_RAW_PER_PAIR
        value: "50"
      - key: SCAN_MAX_PAIRS
        value: "30"
      - key: MAX_QUALIFICATION_CANDIDATES
        value: "80"

  - type: web
    name: signal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: signal-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
