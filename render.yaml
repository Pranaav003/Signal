  - type: web
    name: signal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: signal-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
